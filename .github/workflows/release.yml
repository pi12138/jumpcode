name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - name: Build release archives
        run: go run ./scripts/release --version "$RELEASE_TAG"
      - name: Verify checksums and Linux binary
        run: |
          cd "dist/$RELEASE_TAG"
          sha256sum -c SHA256SUMS
          tar -xzf "jumpcode_${RELEASE_TAG}_linux_amd64.tar.gz" -C "$RUNNER_TEMP" jc
          "$RUNNER_TEMP/jc" --version
          "$RUNNER_TEMP/jc" --help
      - name: Prepare bilingual release notes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          zh = Path(f'docs/releases/{tag}.md').read_text().splitlines()[4:]
          en = Path(f'docs/releases/{tag}.en.md').read_text().splitlines()[4:]
          notes = '\n'.join(zh) + '\n\n<details>\n<summary>English</summary>\n\n' + '\n'.join(en) + '\n\n</details>\n'
          (Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').write_text(notes)
          PY
      - name: Publish release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release-state.json" 2>/dev/null; then
            if ! jq -e '.isDraft' "$RUNNER_TEMP/release-state.json" > /dev/null; then
              echo "Release $RELEASE_TAG is already published; refusing to overwrite it."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease="$prerelease" --title "Jumpcode $RELEASE_TAG" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" "dist/$RELEASE_TAG/"* --clobber
          gh release edit "$RELEASE_TAG" --verify-tag --draft=false --prerelease="$prerelease" --title "Jumpcode $RELEASE_TAG" --notes-file "$notes"
